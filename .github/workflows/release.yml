name: Release

# PACKAGING.md §4's build matrix: one job per (os, arch) row, producing a
# platform-native installer via tauri-action, attached to a draft GitHub
# Release. Code signing (Authenticode/notarization) is not configured yet
# (PACKAGING.md §5 — tracked separately, not a blocker for internal builds);
# artifacts here are unsigned and will trigger the corresponding OS
# install-time warnings until certificates are set up.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.1.0) — required so a manual run doesn't tag the branch name itself"
        required: true
        type: string

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-15-intel # Intel — macos-13 was retired by GitHub on 2025-12-08
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
          - platform: windows-latest
            target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "DocuMind ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: |
            Unsigned build (no code-signing certificates yet — see PACKAGING.md §5), so your OS will warn on first launch. That's expected; instructions below.

            ## Download & install

            **Windows** — download the `.msi` (or `.exe`), run it. SmartScreen will warn "Windows protected your PC" → click **More info → Run anyway**.

            **macOS** — download the `.dmg`, drag DocuMind into Applications. Gatekeeper will block a normal double-click on first open → **right-click the app → Open** (or System Settings → Privacy & Security → "Open Anyway").

            **Linux (`.deb`, Debian/Ubuntu)** — `sudo apt install ./DocuMind_*.deb` (or `sudo dpkg -i` + `sudo apt -f install` if you used dpkg directly). This automatically installs everything DocuMind needs: Tesseract OCR + English/Vietnamese language data, Poppler (PDF tools), and the spelling dictionaries.

            **Linux (`.AppImage`, any distro)** — `chmod +x DocuMind_*.AppImage && ./DocuMind_*.AppImage`. Unlike the `.deb`, this does **not** auto-install the OCR dependencies above. On first launch, the app's "Local Components" panel will show exactly what's missing; on apt-based distros (Ubuntu/Debian/Mint/...) there's an **Install Missing Dependencies** button that installs them for you (asks for your password via a graphical prompt). On other distros, the app shows the equivalent manual install command to run yourself.

            ## Current limitation

            OCR currently runs via the system's Tesseract installation rather than a bundled engine (see MVP_PLAN.md's Phase 2 engine-sequencing note) — this is why the dependencies above exist at all. That will go away once the documented default OCR engine (RapidOCR via ONNX Runtime) ships bundled with the app.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
